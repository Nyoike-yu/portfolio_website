<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Nyoro Fadhili | Backend Developer &amp; Data Analyst</title>
    <meta name="description" content="Portfolio of Nyoro Fadhili, a backend developer and data analyst building secure, data-driven applications." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      /* Apply the saved / system theme before first paint to avoid a flash */
      (function () {
        try {
          var root = document.documentElement, t = null;
          try { t = localStorage.getItem("theme"); } catch (e) {}
          if (!t) t = root.getAttribute("data-theme");
          if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          root.classList.toggle("dark", t === "dark");
          root.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
